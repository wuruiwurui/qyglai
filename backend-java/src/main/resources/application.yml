server:
  port: 8080

spring:
  application:
    name: automation-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qyglai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: qyglai-backend
      auto-offset-reset: earliest
  sql:
    init:
      mode: never
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qyglai.automation.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

logging:
  charset:
    console: UTF-8
  level:
    root: INFO
    com.qyglai.automation: INFO
    com.qyglai.automation.mapper: DEBUG
    org.springframework.security: INFO

automation:
  security:
    jwt-secret: qyglai-local-secret-change-in-production-2026
    token-ttl-seconds: 86400
  messaging:
    kafka-enabled: false
    default-topic: qyglai-business-events
  cache:
    redis-enabled: false
  vector-store:
    enabled: true
    embedding-model: ep-20260615092553-lqvch
    embedding-url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
    dimension: 2048
    milvus-url: http://localhost:19530
    collection: qyglai_knowledge_chunks

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:qyglai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
